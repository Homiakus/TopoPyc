[project]
name = "topopyc"
version = "0.1.0"
description = "Production Topological Sheaf Python Compiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
topopyc = "topopyc.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
